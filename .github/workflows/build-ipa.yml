name: Build iOS IPA

on:
  push:
    branches: [master, feature/cbz-multi-dir]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          targets: aarch64-apple-ios

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS archive
        run: |
          flutter build ios --release --no-codesign
          # Force UIFileSharingEnabled to false (hides from Files app)
          plutil -replace UIFileSharingEnabled -bool NO build/ios/iphoneos/Runner.app/Info.plist
          plutil -replace LSSupportsOpeningDocumentsInPlace -bool NO build/ios/iphoneos/Runner.app/Info.plist
          mkdir -p build/Payload
          cp -r build/ios/iphoneos/Runner.app build/Payload/
          cd build && zip -r9 ../venera-unsigned.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: venera-unsigned
          path: venera-unsigned.ipa
          compression-level: 0
